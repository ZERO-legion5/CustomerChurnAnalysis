{% extends "base.html" %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="row fade-in mb-4">
    <div class="col-12">
        <h2 class="h3 mb-0 text-primary pb-2" style="border-bottom: 1px solid rgba(0,243,255,0.3);">Analytics Dashboard</h2>
    </div>
</div>

<div class="row fade-in">
    <!-- Geography Chart -->
    <div class="col-xl-4 col-lg-5 mb-4">
        <div class="card shadow h-100">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold">Churn by Geography</h6>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="geoChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Balance Chart -->
    <div class="col-xl-8 col-lg-7 mb-4">
        <div class="card shadow h-100">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold">Average Balance Comparison</h6>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="balanceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Age Distribution Chart -->
    <div class="col-12 mb-4">
        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold">Age Distribution (Churn vs Stay)</h6>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="ageChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    // Set Global Chart Defaults for Dark Theme
    Chart.defaults.color = '#8b9bb4';
    Chart.defaults.font.family = "'Rajdhani', sans-serif";
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.05)';
    
    // Data from Flask
    const geoData = {{ geo_stats | tojson }};
    const balanceData = {{ balance_stats | tojson }};
    const ageChurn = {{ age_churn | tojson }};
    const ageStay = {{ age_stay | tojson }};

    // 1. Geography Chart (Doughnut)
    const ctxGeo = document.getElementById('geoChart').getContext('2d');
    new Chart(ctxGeo, {
        type: 'doughnut',
        data: {
            labels: Object.keys(geoData),
            datasets: [{
                data: Object.values(geoData).map(v => (v * 100).toFixed(1)), // Convert to %
                backgroundColor: ['#00f3ff', '#0aff60', '#bc13fe'],
                borderColor: '#0d0e15',
                borderWidth: 2,
                hoverOffset: 10
            }],
        },
        options: {
            maintainAspectRatio: false,
            plugins: {
                tooltip: { 
                    callbacks: { label: (c) => ` Churn Rate: ${c.raw}%` },
                    backgroundColor: 'rgba(5, 5, 8, 0.9)',
                    titleColor: '#00f3ff',
                    borderWidth: 1,
                    borderColor: 'rgba(0, 243, 255, 0.3)'
                },
                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
            },
        }
    });

    // 2. Balance Chart (Bar)
    const ctxBal = document.getElementById('balanceChart').getContext('2d');
    new Chart(ctxBal, {
        type: 'bar',
        data: {
            labels: Object.keys(balanceData),
            datasets: [{
                label: 'Average Balance ($)',
                data: Object.values(balanceData),
                backgroundColor: ['rgba(255, 0, 60, 0.6)', 'rgba(10, 255, 96, 0.6)'],
                borderColor: ['#ff003c', '#0aff60'],
                borderWidth: 1,
                borderRadius: 2,
                barPercentage: 0.6
            }]
        },
        options: {
            maintainAspectRatio: false,
            scales: {
                y: { 
                    beginAtZero: true, 
                    grid: { color: 'rgba(255,255,255,0.03)' },
                    ticks: { color: '#8b9bb4' }
                },
                x: { grid: { display: false }, ticks: { color: '#ffffff', font: { weight: 'bold' } } }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });

    // 3. Age Distribution (Line)
    function createHistogram(data, binSize=5, maxAge=90) {
        const bins = {};
        for (let i = 18; i <= maxAge; i += binSize) {
            bins[i] = 0;
        }
        data.forEach(age => {
            for (let b in bins) {
                if (age >= parseInt(b) && age < parseInt(b) + binSize) {
                    bins[b]++;
                    break;
                }
            }
        });
        return bins;
    }

    const churnBins = createHistogram(ageChurn);
    const stayBins = createHistogram(ageStay);
    
    const ctxAge = document.getElementById('ageChart').getContext('2d');
    new Chart(ctxAge, {
        type: 'line',
        data: {
            labels: Object.keys(churnBins).map(b => `${b}-${parseInt(b)+4}`),
            datasets: [
                {
                    label: 'Churned',
                    data: Object.values(churnBins),
                    borderColor: '#ff003c',
                    backgroundColor: 'rgba(255, 0, 60, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#ff003c',
                    pointRadius: 4,
                    pointHoverRadius: 6
                },
                {
                    label: 'Retained',
                    data: Object.values(stayBins),
                    borderColor: '#0aff60',
                    backgroundColor: 'rgba(10, 255, 96, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#0aff60',
                    pointRadius: 4,
                    pointHoverRadius: 6
                }
            ]
        },
        options: {
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            scales: {
                y: { 
                    beginAtZero: true, 
                    title: {display: true, text: 'Number of Customers', color: '#8b9bb4'},
                    grid: { color: 'rgba(255,255,255,0.03)' }
                },
                x: { 
                    title: {display: true, text: 'Age Group', color: '#8b9bb4'},
                    grid: { display: false }
                }
            },
            plugins: {
                legend: { labels: { usePointStyle: true, padding: 20 } },
                tooltip: {
                    backgroundColor: 'rgba(5, 5, 8, 0.9)',
                    titleColor: '#00f3ff',
                    borderWidth: 1,
                    borderColor: 'rgba(0, 243, 255, 0.3)'
                }
            }
        }
    });

</script>
{% endblock %}
