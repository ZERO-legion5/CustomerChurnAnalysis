<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChurnGuard | Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --dark: #212529;
            --light: #f8f9fa;
        }
        body { background: #f0f2f5; font-family: 'Inter', sans-serif; }
        .sidebar { background: white; min-height: 100vh; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; width: inherit; z-index: 100; }
        .nav-link { color: #4a5568; padding: 1rem 1.5rem; border-radius: 10px; margin: 0.2rem 1rem; transition: all 0.3s; }
        .nav-link:hover { background: #f7fafc; color: var(--primary); }
        .nav-link.active { background: var(--primary); color: white; }
        .main-content { padding: 3rem; margin-left: 16.666667%; }
        .dashboard-card { background: white; border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .card-header { background: none; border-bottom: 1px solid #edf2f7; font-weight: 700; color: #2d3748; padding: 1.25rem; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 p-0 sidebar">
            <div class="p-4 mb-4">
                <h4 class="fw-bold text-primary"><i class="fas fa-shield-halved me-2"></i>ChurnGuard</h4>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="/"><i class="fas fa-brain me-2"></i> Predictor</a>
                <a class="nav-link active" href="/dashboard"><i class="fas fa-chart-pie me-2"></i> Dashboard</a>
                <a class="nav-link" href="/personas"><i class="fas fa-users me-2"></i> Personas</a>
                <a class="nav-link" href="/chat"><i class="fas fa-comments me-2"></i> AI Chat</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="fw-bold">Platform Analytics</h2>
                <span class="badge bg-primary-subtle text-primary p-2">Macro Business Intelligence</span>
            </div>

            <div class="row">
                <div class="col-lg-6">
                    <div class="card dashboard-card">
                        <div class="card-header">Churn Rate by Geography (%)</div>
                        <div class="card-body">
                            <div id="geoChart"></div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card dashboard-card">
                        <div class="card-header">Average Balance: Churn vs Stay</div>
                        <div class="card-body">
                            <div id="balanceChart"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card dashboard-card">
                        <div class="card-header">Age Distribution Analysis (Retention Curve)</div>
                        <div class="card-body">
                            <div id="ageChart"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const geoData = {{ geo_stats | tojson }};
    Plotly.newPlot('geoChart', [{
        x: Object.keys(geoData),
        y: Object.values(geoData).map(v => v * 100),
        type: 'bar',
        marker: { color: '#4361ee' }
    }], { margin: { t: 10, b: 40, l: 40, r: 10 }, height: 350 });

    const balanceData = {{ balance_stats | tojson }};
    Plotly.newPlot('balanceChart', [{
        labels: Object.keys(balanceData),
        values: Object.values(balanceData),
        type: 'pie',
        hole: 0.4,
        marker: { colors: ['#f56565', '#48bb78'] }
    }], { margin: { t: 10, b: 10, l: 10, r: 10 }, height: 350 });

    Plotly.newPlot('ageChart', [
        { x: {{ age_stay | tojson }}, name: 'Stayed', type: 'histogram', opacity: 0.5, marker: { color: '#48bb78' } },
        { x: {{ age_churn | tojson }}, name: 'Churned', type: 'histogram', opacity: 0.7, marker: { color: '#f56565' } }
    ], { barmode: 'overlay', margin: { t: 10, b: 40, l: 40, r: 10 }, height: 400 });
</script>

</body>
</html>
