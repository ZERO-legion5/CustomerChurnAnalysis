{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center fade-in h-100">
    <div class="col-lg-10 col-xl-8 h-100">
        <div class="card shadow mb-4" style="height: 85vh; display: flex; flex-direction: column;">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold"><i class="fas fa-robot me-2"></i>AI Data Analyst</h6>
                <span class="badge bg-secondary">System Online</span>
            </div>
            
            <!-- Chat Container: Scrollable -->
            <div class="card-body p-0 d-flex flex-column" style="overflow: hidden;">
                <div id="chatBox" class="chat-box" style="flex-grow: 1; padding: 1.5rem; overflow-y: auto; background: rgba(0,0,0,0.2);">
                    <div class="message bot">
                        Hello! I am ChurnGuard AI. I have access to the full dataset statistics. Ask me anything about customer churn patterns!
                    </div>
                </div>
                
                <!-- Input Area: Fixed at bottom -->
                <div class="p-3 bg-dark border-top border-secondary">
                    <div class="input-group">
                        <input type="text" id="userInput" class="form-control border-secondary" placeholder="Ask a question (e.g., 'What is the churn rate in Germany?')">
                        <button class="btn btn-primary px-4" type="button" id="btnSend">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const btnSend = document.getElementById('btnSend');

    // Auto-scroll to bottom
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = text.replace(/\n/g, '<br>'); // Simple formatting
        chatBox.appendChild(div);
        scrollToBottom();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Add user message
        appendMessage(text, 'user');
        userInput.value = '';
        userInput.disabled = true;
        btnSend.disabled = true;

        // Show typing indicator
        const loadingId = 'loading-' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot';
        loadingDiv.id = loadingId;
        loadingDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
        chatBox.appendChild(loadingDiv);
        scrollToBottom();

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();

            // Remove loading indicator
            document.getElementById(loadingId).remove();

            if (data.success) {
                appendMessage(data.reply, 'bot');
            } else {
                appendMessage("Sorry, I encountered an error: " + data.error, 'bot text-danger');
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("Network error. Please try again.", 'bot text-danger');
        } finally {
            userInput.disabled = false;
            btnSend.disabled = false;
            userInput.focus();
        }
    }

    btnSend.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
{% endblock %}
