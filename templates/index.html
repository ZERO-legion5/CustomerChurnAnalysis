{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold"><i class="fas fa-user-check me-2"></i>Customer Churn Prediction</h6>
            </div>
            <div class="card-body">
                <form id="predictForm">
                    <div class="row g-3">
                        <!-- Credit Score -->
                        <div class="col-md-6">
                            <label class="form-label">Credit Score</label>
                            <input type="number" class="form-control" name="CreditScore" placeholder="e.g. 600" required min="300" max="850">
                        </div>
                        
                        <!-- Geography -->
                        <div class="col-md-6">
                            <label class="form-label">Geography</label>
                            <select class="form-select" name="Geography" required>
                                <option value="France">France</option>
                                <option value="Germany">Germany</option>
                                <option value="Spain">Spain</option>
                            </select>
                        </div>

                        <!-- Gender -->
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select class="form-select" name="Gender" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                        <!-- Age -->
                        <div class="col-md-6">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" name="Age" placeholder="e.g. 40" required min="18" max="100">
                        </div>

                        <!-- Tenure -->
                        <div class="col-md-6">
                            <label class="form-label">Tenure (Years)</label>
                            <input type="number" class="form-control" name="Tenure" placeholder="0-10" required min="0" max="10">
                        </div>

                        <!-- Balance -->
                        <div class="col-md-6">
                            <label class="form-label">Balance ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" name="Balance" placeholder="0.00" required step="0.01">
                            </div>
                        </div>

                        <!-- Num Of Products -->
                        <div class="col-md-6">
                            <label class="form-label">Number of Products</label>
                            <select class="form-select" name="NumOfProducts" required>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </div>

                        <!-- Estimated Salary -->
                        <div class="col-md-6">
                            <label class="form-label">Estimated Salary ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" name="EstimatedSalary" placeholder="50000.00" required step="0.01">
                            </div>
                        </div>

                        <!-- Boolean Features -->
                        <div class="col-md-6">
                            <label class="form-label">Has Credit Card?</label>
                            <select class="form-select" name="HasCrCard" required>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Is Active Member?</label>
                            <select class="form-select" name="IsActiveMember" required>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="text-center mt-5">
                        <button type="submit" class="btn btn-primary btn-lg w-50" style="letter-spacing: 2px;">
                            <i class="fas fa-search me-2"></i>Analyze Risk
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results Section (Hidden by default) -->
        <div id="resultSection" class="card shadow mb-4 d-none fade-in">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold">Analysis Result</h6>
                <span id="riskBadge" class="badge bg-secondary fs-6">Status Unknown</span>
            </div>
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-6 text-center mb-3 mb-md-0">
                        <h2 id="predictionText" class="fw-bold mb-1" style="font-size: 3rem;">--</h2>
                        <p class="text-muted mb-0">Prediction</p>
                        <div class="mt-4">
                            <div class="progress" style="height: 30px;">
                                <div id="confidenceBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                            </div>
                            <small class="text-muted mt-2 d-block">Model Confidence: <span id="confidenceText" class="text-white">0%</span></small>
                        </div>
                    </div>
                    <div class="col-md-6 border-start border-secondary ps-md-4">
                        <h6 class="fw-bold border-bottom pb-2 mb-3" style="color: var(--text-muted);">Top Influencing Factors (SHAP)</h6>
                        <ul id="shapList" class="list-group list-group-flush small" style="background: transparent;">
                            <!-- JS will populate -->
                        </ul>
                    </div>
                </div>

                <hr class="my-4" style="border-color: rgba(255,255,255,0.1);">

                <!-- Strategy & Actions -->
                <div class="row g-3">
                    <div class="col-md-12">
                        <div id="strategyBox" class="alert alert-info d-none bg-transparent border-info text-info">
                            <h6 class="alert-heading fw-bold"><i class="fas fa-lightbulb me-2"></i>AI Retention Strategy</h6>
                            <p id="strategyText" class="mb-0 small" style="color: #e0f7fa;"></p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <button id="btnStrategy" class="btn btn-outline-primary w-100 py-2">
                            <i class="fas fa-magic me-2"></i>Generate AI Strategy
                        </button>
                    </div>
                    <div class="col-md-6">
                        <button id="btnReport" class="btn btn-outline-dark w-100 py-2">
                            <i class="fas fa-file-pdf me-2"></i>Download Full Report
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Loading Overlay -->
<div class="spinner-overlay" id="loader">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 fw-bold" style="color: var(--primary-color); letter-spacing: 2px;">PROCESSING DATA...</p>
</div>

{% endblock %}

{% block scripts %}
<script>
    let currentResult = null;

    // Populate random default values on load
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('predictForm');
        const geographies = ['France', 'Germany', 'Spain'];
        const genders = ['Male', 'Female'];
        
        form.elements['CreditScore'].value = Math.floor(Math.random() * (850 - 400 + 1)) + 400;
        form.elements['Geography'].value = geographies[Math.floor(Math.random() * geographies.length)];
        form.elements['Gender'].value = genders[Math.floor(Math.random() * genders.length)];
        form.elements['Age'].value = Math.floor(Math.random() * (65 - 18 + 1)) + 18;
        form.elements['Tenure'].value = Math.floor(Math.random() * 11);
        form.elements['Balance'].value = (Math.random() * 150000).toFixed(2);
        form.elements['NumOfProducts'].value = Math.floor(Math.random() * 3) + 1;
        form.elements['EstimatedSalary'].value = (Math.random() * (180000 - 30000) + 30000).toFixed(2);
        form.elements['HasCrCard'].value = Math.random() > 0.3 ? "1" : "0";
        form.elements['IsActiveMember'].value = Math.random() > 0.5 ? "1" : "0";
    });

    document.getElementById('predictForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const loader = document.getElementById('loader');
        
        // Correct way to show flex loader
        loader.classList.add('show');

        // Gather Data
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (result.success) {
                currentResult = { ...result, customer_data: data };
                displayResult(result);
            } else {
                alert('Error: ' + result.error);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An unexpected error occurred.');
        } finally {
            loader.classList.remove('show');
        }
    });

    function displayResult(data) {
        const resultSection = document.getElementById('resultSection');
        resultSection.classList.remove('d-none');
        
        // Update Prediction Text
        const predText = document.getElementById('predictionText');
        const riskBadge = document.getElementById('riskBadge');
        const bar = document.getElementById('confidenceBar');
        const confText = document.getElementById('confidenceText');

        predText.textContent = data.result;
        confText.textContent = data.confidence + '%';
        bar.style.width = data.confidence + '%';

        if (data.result === 'Churn') {
            predText.classList.remove('text-success');
            predText.style.color = 'var(--danger-color)';
            predText.style.textShadow = 'var(--glow-danger)';
            
            riskBadge.className = 'badge bg-danger fs-6';
            riskBadge.textContent = 'High Risk';
            
            bar.className = 'progress-bar bg-danger progress-bar-striped progress-bar-animated';
        } else {
            predText.style.color = 'var(--success-color)';
            predText.style.textShadow = 'var(--glow-success)';
            
            riskBadge.className = 'badge bg-success fs-6';
            riskBadge.textContent = 'Low Risk';
            
            bar.className = 'progress-bar bg-success progress-bar-striped progress-bar-animated';
        }

        // Update SHAP List
        const list = document.getElementById('shapList');
        list.innerHTML = '';
        data.explanations.slice(0, 5).forEach(exp => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent text-white border-bottom border-secondary';
            const colorClass = exp.type === 'positive' ? 'text-danger' : 'text-success';
            const icon = exp.type === 'positive' ? 'fa-arrow-up' : 'fa-arrow-down';
            
            li.innerHTML = `
                <span>${exp.feature}</span>
                <span class="${colorClass} fw-bold">
                    <i class="fas ${icon} me-1 small"></i>${Math.abs(exp.influence).toFixed(4)}
                </span>
            `;
            list.appendChild(li);
        });

        // Reset Strategy Box
        document.getElementById('strategyBox').classList.add('d-none');
        document.getElementById('btnStrategy').disabled = false;
        
        // Scroll to result
        resultSection.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('btnStrategy').addEventListener('click', async () => {
        if (!currentResult) return;
        const btn = document.getElementById('btnStrategy');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Generating...';
        btn.disabled = true;

        try {
            const response = await fetch('/generate_strategy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(currentResult)
            });
            const data = await response.json();
            
            if (data.success) {
                const box = document.getElementById('strategyBox');
                box.classList.remove('d-none');
                document.getElementById('strategyText').innerText = data.strategy;
                
                // Add strategy to currentResult for reporting
                currentResult.strategy = data.strategy;

                // Save to DB
                await fetch('/save_strategy', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        customer_data: currentResult.customer_data,
                        prediction: currentResult.result,
                        strategy: data.strategy
                    })
                });
            } else {
                alert('Failed to generate strategy: ' + data.error);
            }
        } catch (e) {
            console.error(e);
        } finally {
            btn.innerHTML = originalText;
        }
    });

    document.getElementById('btnReport').addEventListener('click', async () => {
        if (!currentResult) return;
        const btn = document.getElementById('btnReport');
        btn.disabled = true;
        
        try {
            const response = await fetch('/generate_report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(currentResult)
            });
            
            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Retention_Report.pdf";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                alert("Failed to generate report");
            }
        } catch(e) {
            console.error(e);
        } finally {
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
